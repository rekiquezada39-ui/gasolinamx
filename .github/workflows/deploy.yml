name: Actualizar precios de gasolina

on:
  schedule:
    # 13:00 UTC = 7:00 AM hora de México (CST)
    - cron: '0 13 * * *'
  workflow_dispatch:      # boton manual en la pestaña Actions
  push:
    branches: [ main ]    # tambien al subir cambios

# necesario para que el bot pueda hacer commit del historial
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generar el sitio
        run: node build.js

      # ── SIN ESTE PASO EL HISTORICO SE PIERDE CADA DIA ──
      # build.js escribe historial.json y .geocache.json en el runner,
      # pero el runner se destruye al terminar. Hay que devolverlos al repo.
      - name: Guardar historial y cache de municipios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f historial.json .geocache.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el historial."
          else
            git commit -m "Historial de precios $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gasolinamx --branch=main
